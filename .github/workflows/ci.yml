name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The toolchain and its components come from rust-toolchain.toml.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # pdx-ws outside cargo, which otherwise puts steam_api on the library
      # path (build.rs). On Windows steam_api64.dll is delay-loaded: without
      # it everything but client mode works, and client mode says what is
      # missing before calling Steam. On Linux libsteam_api.so is found next
      # to the binary through its $ORIGIN rpath.
      - name: Start without cargo's library path
        shell: bash
        run: |
          set -euo pipefail
          bare="$RUNNER_TEMP/bare"
          mkdir -p "$bare"
          config="$PWD/tests/fixtures/eu4/workshop.toml"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/debug/pdx-ws.exe "$bare/"
            "$bare/pdx-ws.exe" --version
            "$bare/pdx-ws.exe" plan --config "$config" > /dev/null
            set +e
            "$bare/pdx-ws.exe" publish --mode client --config "$config" 2> "$bare/stderr.txt"
            code=$?
            set -e
            cat "$bare/stderr.txt"
            test "$code" = 2
            grep -q "client mode needs steam_api64.dll" "$bare/stderr.txt"
          else
            cp target/debug/pdx-ws "$bare/"
            cp "$(find target/debug/build -name libsteam_api.so | head -n 1)" "$bare/"
            env -u LD_LIBRARY_PATH "$bare/pdx-ws" --version
            env -u LD_LIBRARY_PATH "$bare/pdx-ws" plan --config "$config" > /dev/null
          fi

  # The cargo-dist config stays valid while publishing is off (spec section 14, step 11).
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh

      - name: Plan the release archives
        run: dist plan
