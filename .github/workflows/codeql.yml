name: codeql

# CodeQL code scanning in advanced setup: the Rust crate, the Python scripts
# (scripts/) and the workflows, all analysed without a build. The default
# setup does not offer Rust.
# Results go to Security -> Code scanning. Pushes and pull requests that
# change only documentation or release files skip it; the weekly run still
# analyses main.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - THIRD_PARTY_NOTICES
      - .release-please-manifest.json
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/**
      - LICENSE
      - THIRD_PARTY_NOTICES
      - .release-please-manifest.json
  schedule:
    - cron: "47 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - actions
          - python
          - rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
