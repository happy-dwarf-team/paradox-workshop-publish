name: pr-title

# Pull requests are squash-merged, so the title becomes the commit on main and
# the changelog entry. It must follow Conventional Commits.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >
            Start the subject "{subject}" with a lowercase letter and do not end it
            with a period, e.g. "feat(plan): print the published copy".
