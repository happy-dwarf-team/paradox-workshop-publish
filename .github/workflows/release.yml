name: release

# release-please keeps a "chore: release x.y.z" pull request up to date from
# the Conventional Commits on main and dispatches the E2E workflow on it.
# Merging it tags vX.Y.Z and creates the GitHub release; the jobs below then
# build the archives with cargo-dist (scripts/release/build.sh), attest them,
# upload them with their SHA-256 sums, and run the action against the new
# release (docs/spec/v1.md, section 13).
#
# On pull requests that touch the release files, and on manual dispatch, the
# archives are built and checked but nothing is published.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - dist-workspace.toml
      - THIRD_PARTY_NOTICES
      - Cargo.toml
      - Cargo.lock
      - build.rs
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # With the default token the release PR does not trigger CI (GitHub does
      # not start workflows from GITHUB_TOKEN events, except dispatches). A
      # RELEASE_PLEASE_TOKEN secret (fine-grained token or GitHub App token)
      # makes the checks run on it.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      # The E2E workflow publishes the test item, so it waits for the
      # steam-workshop-e2e reviewer. Dispatches are the one kind of
      # GITHUB_TOKEN event that starts a workflow.
      - name: Run E2E on the release pull request
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName' <<< "$PR")
          echo "Dispatching e2e.yml on $branch"
          gh workflow run e2e.yml --ref "$branch"

  build:
    needs: release-please
    if: >-
      always() && (github.event_name != 'push' ||
      needs.release-please.outputs.release_created == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}
          cargo --version

      - name: Install cargo-dist
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command "irm https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.ps1 | iex"
          else
            curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh
          fi
          dist --version

      - name: Build and check the archive
        shell: bash
        run: scripts/release/build.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: |
            target/distrib/pdx-ws-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum pdx-ws-*.zip pdx-ws-*.tar.xz > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Each archive's own .sha256 must agree with the sums file.
          for sum in *.sha256; do
            expected=$(awk '{print $1}' "$sum")
            grep -q "^$expected  ${sum%.sha256}$" SHA256SUMS.txt
          done

      # Signed build provenance, checked by the action with
      # `gh attestation verify <archive> --repo happy-dwarf-team/paradox-workshop-publish`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/pdx-ws-*.zip
            dist/pdx-ws-*.tar.xz

      - name: Upload the release assets
        working-directory: dist
        run: gh release upload "$TAG" pdx-ws-* SHA256SUMS.txt --clobber

  # The action as users run it: download the new release for the runner,
  # verify its attestation, and plan the fixture mods as a dry run.
  verify-release:
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dry run with the released pdx-ws
        id: dry-run
        uses: ./
        with:
          config: tests/fixtures/eu4/workshop.toml
          dry-run: true
          pdx-ws-version: ${{ needs.release-please.outputs.tag_name }}

      - name: Check the outputs
        shell: bash
        env:
          ITEM_ID: ${{ steps.dry-run.outputs.item-id }}
        run: test "$ITEM_ID" = 2948217283
