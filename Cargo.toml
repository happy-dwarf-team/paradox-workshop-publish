[workspace]
# Listed explicitly: release-please's rust strategy bumps the version of each
# member named here (and Cargo.lock), so every crate shares the release version.
members = ["crates/pdx-ws"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/happy-dwarf-team/paradox-workshop-publish"

[workspace.lints.rust]
unsafe_code = "forbid"

# The release-archive build used by cargo-dist (dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"
