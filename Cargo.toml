[package]
name = "pdx-ws"
# Set by release-please; 0.0.0 until the first release (0.1.0).
version = "0.0.0"
description = "Publish Paradox Interactive game mods to the Steam Workshop"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/happy-dwarf-team/paradox-workshop-publish"

# pdx-ws is the workspace root. release-please's rust strategy needs a package
# here; it bumps the version of every member below (and Cargo.lock) together,
# so further crates under crates/ share the release version.
[workspace]
members = []

[workspace.lints.rust]
unsafe_code = "forbid"

[lints]
workspace = true

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
globset = "0.4"
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
steamworks = "0.13"
tempfile = "3.27"
thiserror = "2.0"
toml = "1.1"
toml_edit = "0.25"
ureq = "3.4"

# steamcmd ships as a zip on Windows and as a tar.gz elsewhere.
[target.'cfg(windows)'.dependencies]
zip = { version = "9.0", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
tar = "0.4"

# The test binary doubles as a fake steamcmd, so it has its own main.
[[test]]
name = "steamcmd"
harness = false

# The release-archive build used by cargo-dist (dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"
