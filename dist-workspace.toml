# cargo-dist (https://axodotdev.github.io/cargo-dist/) builds the release
# archives (docs/spec/v1.md, section 13). There is no `ci` key: the release
# workflow (.github/workflows/release.yml) runs `dist build` through
# scripts/release/build.sh on each runner, which adds that platform's
# steam_api to `include` after checking it against the Steamworks SDK.
[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
installers = []
include = ["THIRD_PARTY_NOTICES"]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
